<ion-header class="no-shadow">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/profile"></ion-back-button>
    </ion-buttons>
    <ion-title>Change password</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="save()" novalidate class="fieldset account-form">
    <ion-note class="form-notice">After changing your password you'll be signed out on all devices.</ion-note>

    <ion-input
      formControlName="currentPassword"
      type="password"
      label="Current password"
      labelPlacement="stacked"
      fill="outline"
      placeholder="Enter your current password"
      autocomplete="current-password"
      errorText="Current password is required"
    >
      <ion-input-password-toggle slot="end"></ion-input-password-toggle>
    </ion-input>

    <ion-input
      formControlName="newPassword"
      type="password"
      label="New password"
      labelPlacement="stacked"
      fill="outline"
      placeholder="Create a new password"
      autocomplete="new-password"
      helperText="At least 8 characters"
      [errorText]="passwordErrorText(form.controls.newPassword)"
    >
      <ion-input-password-toggle slot="end"></ion-input-password-toggle>
    </ion-input>

    <ion-input
      formControlName="confirmPassword"
      type="password"
      label="Confirm new password"
      labelPlacement="stacked"
      fill="outline"
      placeholder="Re-enter your new password"
      autocomplete="new-password"
      errorText="Confirm your new password"
    >
      <ion-input-password-toggle slot="end"></ion-input-password-toggle>
    </ion-input>

    @if (mismatch) {
      <ion-note class="form-error" color="danger" role="alert">Passwords don't match.</ion-note>
    }
    @if (errorMessage(); as message) {
      <ion-note class="form-error" color="danger" role="alert">{{ message }}</ion-note>
    }

    <ion-button class="regular" type="submit" expand="block" [disabled]="saving()">
      @if (saving()) {
        <ion-spinner name="dots" aria-label="Changing password"></ion-spinner>
      } @else {
        Change password
      }
    </ion-button>
  </form>
</ion-content>
