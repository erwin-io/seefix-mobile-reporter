<ion-header class="no-shadow">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/auth/login"></ion-back-button>
    </ion-buttons>
    <ion-title>Forgot password</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding auth-page">
  <div class="auth-wrap">
    <ion-card class="auth-card no-shadow">
      <ion-card-header>
        <ion-card-title>Reset your password</ion-card-title>
        <ion-card-subtitle>Enter your account email. We'll send a six-digit code to reset your password.</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="fieldset">
          <ion-input
            formControlName="email"
            type="email"
            label="Email"
            labelPlacement="stacked"
            fill="outline"
            placeholder="Enter your account email"
            autocomplete="email"
            inputmode="email"
            autocapitalize="off"
            [clearInput]="true"
            errorText="Enter a valid email address"
          ></ion-input>

          @if (errorMessage(); as message) {
            <ion-note class="form-error" color="danger" role="alert">{{ message }}</ion-note>
          }

          <ion-button class="regular" type="submit" expand="block" [disabled]="submitting()">
            @if (submitting()) {
              <ion-spinner name="dots" aria-label="Sending"></ion-spinner>
            } @else {
              Send reset code
            }
          </ion-button>
        </form>

        <div class="link-row">
          <ion-button fill="clear" (click)="haveCode()">I already have a code</ion-button>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
